name: Publish tlda fork package

on:
  push:
    tags:
      - 'tlda-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build editor package
        run: |
          mkdir -p release-artifacts
          yarn workspace @tldraw/editor pack \
            --out "$GITHUB_WORKSPACE/release-artifacts/tldraw-editor-5.2.0-tlda.2.tgz"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/tldraw-editor-5.2.0-tlda.2.tgz
          generate_release_notes: true
